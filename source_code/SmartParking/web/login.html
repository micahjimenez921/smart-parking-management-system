<!DOCTYPE html>
<html lang="en" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - SmartPark</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232f6df6'/%3E%3Ctext x='16' y='24' font-family='Arial' font-size='22' font-weight='bold' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="vendor/fonts/sp-display-black.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="login.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <main class="stage" id="stage" data-mode="signin">

    <header class="topbar">
      <a class="logo" href="login.html" aria-label="SmartPark">
        <span class="logo-mark">P</span>
        <span class="logo-name">SmartPark</span>
      </a>
      <div class="switch">
        <span id="switch-text">New driver?</span>
        <button type="button" class="pill" id="switch-button">Create account</button>
      </div>
    </header>

    <section class="hero">
      <h1 id="login-title">Smart
Parking</h1>
      <p class="lead" id="login-lead">Sign in to see open bays, your reservations and what you owe.</p>

      <form id="login-form" class="form" novalidate>
        <label class="field">
          <span>Username</span>
          <input id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="login-password" type="password" autocomplete="current-password">
        </label>
        <div class="form-msg" id="login-msg" role="alert" hidden></div>
        <button class="pill pill-solid" id="login-submit" type="submit">Sign in</button>
      </form>

      <form id="register-form" class="form form-wide" novalidate hidden>
        <label class="field span-2">
          <span>Full name</span>
          <input id="reg-name" type="text" autocomplete="name">
        </label>
        <label class="field">
          <span>Username</span>
          <input id="reg-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="letters, numbers, . _ -">
        </label>
        <label class="field">
          <span>Plate number (optional)</span>
          <input id="reg-plate" type="text" autocomplete="off" maxlength="12" placeholder="e.g. ABC 123">
        </label>
        <label class="field">
          <span>Password</span>
          <input id="reg-password" type="password" autocomplete="new-password" placeholder="at least 8 characters">
        </label>
        <label class="field">
          <span>Repeat the password</span>
          <input id="reg-again" type="password" autocomplete="new-password">
        </label>
        <div class="form-msg span-2" id="register-msg" role="alert" hidden></div>
        <button class="pill pill-solid span-2" id="register-submit" type="submit">Create account</button>
      </form>
    </section>

    <div class="scene" id="scene" aria-hidden="true">
      <canvas id="scene-canvas"></canvas>
      <div class="plate-tag" id="plate-tag"><b id="plate-text">ABC 1234</b><span id="plate-time">00:00:00:00</span></div>
    </div>

    <footer class="footbar">
      <p class="foot-note" id="foot-note">Staff accounts are made by an administrator.</p>
    </footer>

  </main>

  <script type="module" src="login-scene.js"></script>
  <script src="login.js"></script>
</body>
</html>
